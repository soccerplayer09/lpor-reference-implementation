services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LPOR_ENV=development
    command: ["uvicorn", "web.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
